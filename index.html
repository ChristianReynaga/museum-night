        // ==========================================
        // 2. LÓGICA DEL MOTOR DE TIEMPO
        // ==========================================
        
        // Convierte un string "HH:MM" en un objeto Date del día de hoy para comparar
        function parseTimeStringToDate(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const d = new Date();
            d.setHours(hours, minutes, 0, 0);
            return d;
        }

        // Determina cuál es la actividad actual en una ubicación
        function getCurrentActivity(actividades) {
            const nowTime = new Date();
            for (let act of actividades) {
                const startTime = parseTimeStringToDate(act.inicio);
                const endTime = parseTimeStringToDate(act.fin);
                
                if (nowTime >= startTime && nowTime <= endTime) {
                    return act; // Retorna la actividad en curso
                }
            }
            return null; // Ninguna actividad en este momento
        }

        // ==========================================
        // 3. CONFIGURACIÓN DEL MAPA (LEAFLET)
        // ==========================================
        
        // Inicializar el mapa centrado en La Paz, Bolivia
        const map = L.map('map').setView([-17.783331, -63.182135], 13);

        // Añadir capa de OpenStreetMap (Gratuita)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Objeto para almacenar las referencias a los marcadores y poder actualizarlos
        const markersMap = {};

        // Función para renderizar los marcadores inicialmente
        function renderMapMarkers() {
            jsonData.forEach(location => {
                // Crear el marcador
                const marker = L.marker([location.lat, location.lng]).addTo(map);
                
                // Evaluar estado actual
                const currentAct = getCurrentActivity(location.actividades);
                const tooltipText = currentAct ? `🔴 AHORA: ${currentAct.nombre}` : `⚪ Sin actividad actual`;
                const tooltipClass = currentAct ? 'custom-tooltip' : 'custom-tooltip tooltip-inactive';

                // Añadir etiqueta (Tooltip) visible permanentemente
                marker.bindTooltip(tooltipText, {
                    permanent: true,
                    direction: 'top',
                    className: tooltipClass,
                    offset: [0, -20],
		    interactive: true
                });

                // Añadir evento de Click para abrir detalles
                marker.on('click', () => {
                    openDetailsPanel(location);
                });

                // Guardar referencia
                markersMap[location.id] = { marker, data: location };
            });
        }

        // ==========================================
        // 4. ACTUALIZACIÓN DINÁMICA (CADA MINUTO)
        // ==========================================
        function updateMapMarkers() {
            for (const id in markersMap) {
                const item = markersMap[id];
                const currentAct = getCurrentActivity(item.data.actividades);
                
                const tooltipText = currentAct ? `🔴 AHORA: ${currentAct.nombre}` : `⚪ Sin actividad actual`;
                const tooltipClass = currentAct ? 'custom-tooltip' : 'custom-tooltip tooltip-inactive';
                
                // Actualizar el contenido y estilo del tooltip
                item.marker.setTooltipContent(tooltipText);
                item.marker.getTooltip().options.className = tooltipClass;
            }
            console.log("Estado de actividades actualizado:", new Date().toLocaleTimeString());
        }

        // Ejecutar actualización cada 60 segundos (60000 ms)
        setInterval(updateMapMarkers, 60000);

        // ==========================================
        // 5. LÓGICA DE LA INTERFAZ DE USUARIO (PANEL)
        // ==========================================
        const panel = document.getElementById('details-panel');
        
        function openDetailsPanel(locationData) {
            // Llenar cabecera y contacto
            document.getElementById('panel-title').textContent = locationData.nombre;
            document.getElementById('panel-phone').textContent = locationData.whatsapp;
            document.getElementById('panel-email').textContent = locationData.direccion;
           

            // Llenar cronograma
            const activitiesContainer = document.getElementById('panel-activities');
            activitiesContainer.innerHTML = ''; // Limpiar anteriores

            const nowTime = new Date();

            locationData.actividades.forEach(act => {
                const startTime = parseTimeStringToDate(act.inicio);
                const endTime = parseTimeStringToDate(act.fin);
                
                let statusBadge = '';
                let borderClass = 'border-l-4 border-transparent';
                
                // Determinar el estado visual de la actividad en la lista
                if (nowTime > endTime) {
                    statusBadge = '<span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded ml-2">Finalizado</span>';
                } else if (nowTime >= startTime && nowTime <= endTime) {
                    statusBadge = '<span class="text-xs bg-red-100 text-red-600 font-bold px-2 py-1 rounded ml-2 animate-pulse">En curso</span>';
                    borderClass = 'border-l-4 border-red-500 bg-red-50'; // Resaltar actividad actual
                } else {
                    statusBadge = '<span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded ml-2">Próximamente</span>';
                }

                const actHTML = `
                    <li class="p-3 rounded bg-white shadow-sm border border-gray-100 ${borderClass}">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-gray-800">${act.nombre}</span>
                            ${statusBadge}
                        </div>
                        <div class="text-sm font-medium text-blue-600 mb-1">
                            🕒 ${act.inicio} - ${act.fin}
                        </div>
                    </li>
                `;
                activitiesContainer.innerHTML += actHTML;
            });

            // Mostrar el panel
            panel.classList.remove('panel-hidden');
            panel.classList.add('panel-visible');
        }

        function closePanel() {
            panel.classList.remove('panel-visible');
            panel.classList.add('panel-hidden');
        }

        // ==========================================
        // 6. INICIALIZACIÓN
        // ==========================================
        renderMapMarkers();

    </script>
